name: CI

# Gates what exists. The unit, contract, adversarial and evaluation jobs in NOVA-STP-001 §5.8 arrive
# with the suites they run; an empty job that always passes is worse than an absent one, because it
# reads as coverage.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        # Same digest as compose.yaml. Verified in NOVA-SPK-003.
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_DB: nova
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://nova:nova@127.0.0.1:5432/nova
      # No hosted provider reachable from a runner, and none wanted: integration runs against the
      # fake (DL-019). The gateway's live path is exercised on the development host.
      NOVA_INFERENCE_PROVIDER: fake

    steps:
      # Tag-pinned rather than SHA-pinned. Dependency and supply-chain hardening is M6 (T21).
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Migrations apply, are idempotent, and reject an edited file
        run: python db/migrate.py --selftest

      - name: Migrations reach a clean database
        run: |
          python db/migrate.py
          python db/migrate.py --status

      - name: Inference gateway
        run: python nova/inference.py --selftest
